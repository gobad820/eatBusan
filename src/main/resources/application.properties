spring.application.name=eatBusan

spring.config.import=optional:file:.env[.properties]
server.port=8081

# MySQL DataSource
spring.datasource.url=jdbc:mysql://localhost:3306/eatbusan?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
# spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# init DB
spring.jpa.hibernate.ddl-auto=create
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# MyBatis
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.type-aliases-package=com.ssafy.eatBusan
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

#open api
data.kakao.api.baseurl=https://dapi.kakao.com
data.kakao.api.service.key=${KAKAO_API_KEY}

# jWt
jwt.secret.key=${JWT_SECRET_KEY}
jwt.access.time=1800000
jwt.refresh.time=604800000

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=200ms

# frontend
spring.front.domain=http://localhost:5173

# voteroom: 마감 후 hard delete까지의 유예(분). 스케줄러 1분 주기.
voteroom.delete-delay-minutes=10

# AWS S3
aws.s3.bucket=${AWS_S3_BUCKET}
aws.s3.region=${AWS_REGION:ap-northeast-2}
